<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102c46">

<title>Harrison PDF Reader</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5f8;
    color: #102c46;
}

header {
    background: #102c46;
    color: white;
    padding: 18px;
    text-align: center;
}

header h2 {
    margin: 0;
    font-size: 19px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

button, .upload {
    background: #102c46;
    color: white;
    border: none;
    padding: 12px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}

.upload {
    display: inline-block;
    margin-bottom: 12px;
}

input[type="file"] {
    display: none;
}

input[type="number"] {
    width: 65px;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 7px;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin: 15px 0;
}

#viewer {
    background: #dce3eb;
    padding: 12px;
    min-height: 400px;
    text-align: center;
    border-radius: 10px;
    overflow: auto;
}

canvas {
    max-width: 100%;
    height: auto;
    background: white;
    box-shadow: 0 2px 8px #0002;
}

#status {
    color: #526477;
    margin: 12px 0;
    font-size: 14px;
}

.back {
    display: inline-block;
    margin-top: 15px;
    color: #102c46;
    text-decoration: none;
}
</style>
</head>

<body>

<header>
<h2>HARRISON PDF READER</h2>
<p>Clinical Companion Library</p>
</header>

<div class="container">

<label class="upload" for="pdfFile">
Choose PDF Book
</label>

<input type="file" id="pdfFile" accept="application/pdf">

<div id="status">
No book selected.
</div>

<div class="controls">

<button onclick="previousPage()">Previous</button>

<span>Page</span>

<input type="number" id="pageNum" value="1" min="1">

<span id="totalPages">/ 0</span>

<button onclick="goToPage()">Go</button>

<button onclick="nextPage()">Next</button>

<button onclick="zoomOut()">−</button>

<button onclick="zoomIn()">+</button>

</div>

<div id="viewer">
Select a PDF book to start reading.
</div>

<a class="back" href="index.html">← Back to Home</a>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let pdfDoc = null;
let currentPage = 1;
let scale = 1.3;

const fileInput = document.getElementById("pdfFile");

fileInput.addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) return;

    if (file.type !== "application/pdf") {
        alert("Please select a PDF file.");
        return;
    }

    document.getElementById("status").textContent =
        "Loading book...";

    const reader = new FileReader();

    reader.onload = function() {

        const data = new Uint8Array(reader.result);

        pdfjsLib.getDocument({
            data: data
        }).promise.then(function(pdf) {

            pdfDoc = pdf;
            currentPage = 1;

            document.getElementById("totalPages").textContent =
                "/ " + pdf.numPages;

            document.getElementById("pageNum").max =
                pdf.numPages;

            document.getElementById("status").textContent =
                file.name;

            renderPage(currentPage);

        }).catch(function(error) {

            console.error(error);

            document.getElementById("status").textContent =
                "Unable to open this PDF.";

        });

    };

    reader.readAsArrayBuffer(file);

});

function renderPage(number) {

    if (!pdfDoc) return;

    pdfDoc.getPage(number).then(function(page) {

        const viewport = page.getViewport({
            scale: scale
        });

        const canvas = document.createElement("canvas");

        const context = canvas.getContext("2d");

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        document.getElementById("viewer").innerHTML = "";

        document.getElementById("viewer").appendChild(canvas);

        page.render({
            canvasContext: context,
            viewport: viewport
        });

        document.getElementById("pageNum").value = number;

    });

}

function previousPage() {

    if (pdfDoc && currentPage > 1) {
        currentPage--;
        renderPage(currentPage);
    }

}

function nextPage() {

    if (pdfDoc && currentPage < pdfDoc.numPages) {
        currentPage++;
        renderPage(currentPage);
    }

}

function goToPage() {

    if (!pdfDoc) return;

    const number = Number(
        document.getElementById("pageNum").value
    );

    if (number >= 1 && number <= pdfDoc.numPages) {
        currentPage = number;
        renderPage(currentPage);
    }

}

function zoomIn() {

    scale += 0.2;
    renderPage(currentPage);

}

function zoomOut() {

    if (scale > 0.6) {
        scale -= 0.2;
        renderPage(currentPage);
    }

}

</script>

</body>
</html>
