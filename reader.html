<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102c46">

<title>Harrison Clinical Companion - PDF Reader</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5f8;
    color: #102c46;
}

header {
    background: #102c46;
    color: white;
    padding: 18px;
    text-align: center;
}

header h2 {
    margin: 0;
    font-size: 19px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

button, .upload {
    background: #102c46;
    color: white;
    border: none;
    padding: 12px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}

.upload {
    display: inline-block;
    margin-bottom: 12px;
}

input[type="file"] {
    display: none;
}

input[type="number"] {
    width: 65px;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 7px;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin: 15px 0;
}

#viewer {
    background: #dce3eb;
    padding: 12px;
    min-height: 400px;
    text-align: center;
    border-radius: 10px;
    overflow: auto;
}

canvas {
    display: block;
    max-width: none;
    height: auto;
    background: white;
    box-shadow: 0 2px 8px #0002;
    margin: auto;
}

#status {
    color: #526477;
    margin: 12px 0;
    font-size: 14px;
    overflow-wrap: anywhere;
}

.back {
    display: inline-block;
    margin-top: 15px;
    color: #102c46;
    text-decoration: none;
}
</style>
</head>

<body>

<header>
    <h2>HARRISON PDF READER</h2>
    <p>Clinical Companion Library</p>
</header>

<div class="container">

    <label class="upload" for="pdfFile">
        Choose PDF Book
    </label>

    <input
        type="file"
        id="pdfFile"
        accept=".pdf,application/pdf"
    >

    <div id="status">
        No book selected.
    </div>

    <div class="controls">

        <button onclick="previousPage()">Previous</button>

        <span>Page</span>

        <input
            type="number"
            id="pageNum"
            value="1"
            min="1"
        >

        <span id="totalPages">/ 0</span>

        <button onclick="goToPage()">Go</button>

        <button onclick="nextPage()">Next</button>

        <button onclick="zoomOut()">−</button>

        <button onclick="zoomIn()">+</button>

    </div>

    <div id="viewer">
        Select a PDF book to start reading.
    </div>

    <a class="back" href="index.html">
        ← Back to Home
    </a>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

if (typeof pdfjsLib === "undefined") {

    document.getElementById("status").textContent =
        "PDF reader library could not load. Check your internet connection.";

} else {

    pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    let pdfDoc = null;
    let currentPage = 1;
    let scale = 1.3;

    const fileInput = document.getElementById("pdfFile");

    fileInput.addEventListener("change", function(event) {

        const file = event.target.files[0];

        if (!file) return;

        if (
            file.type !== "application/pdf" &&
            !file.name.toLowerCase().endsWith(".pdf")
        ) {
            alert("Please select a PDF file.");
            return;
        }

        document.getElementById("status").textContent =
            "Loading book...";

        document.getElementById("viewer").textContent =
            "Please wait while the book loads...";

        pdfDoc = null;

        const reader = new FileReader();

        reader.onerror = function() {

            document.getElementById("status").textContent =
                "Error reading the selected file.";

            alert("Could not read this file.");

        };

        reader.onload = function() {

            const data = new Uint8Array(reader.result);

            pdfjsLib.getDocument({
                data: data
            }).promise.then(function(pdf) {

                pdfDoc = pdf;
                currentPage = 1;

                document.getElementById("totalPages").textContent =
                    "/ " + pdf.numPages;

                document.getElementById("pageNum").max =
                    pdf.numPages;

                document.getElementById("status").textContent =
                    file.name;

                renderPage(currentPage);

            }).catch(function(error) {

                console.error(error);

                document.getElementById("status").textContent =
                    "Unable to open this PDF.";

                document.getElementById("viewer").textContent =
                    "The PDF could not be opened.";

                alert("Unable to open this PDF. Please try another file.");

            });

        };

        reader.readAsArrayBuffer(file);

    });

    function renderPage(number) {

        if (!pdfDoc) return;

        pdfDoc.getPage(number).then(function(page) {

            const viewport = page.getViewport({
                scale: scale
            });

            const pixelRatio = Math.min(
                window.devicePixelRatio || 1,
                3
            );

            const canvas = document.createElement("canvas");

            const context = canvas.getContext("2d");

            canvas.width = Math.floor(
                viewport.width * pixelRatio
            );

            canvas.height = Math.floor(
                viewport.height * pixelRatio
            );

            canvas.style.width = viewport.width + "px";
            canvas.style.height = viewport.height + "px";

            const viewer = document.getElementById("viewer");

            viewer.innerHTML = "";
            viewer.appendChild(canvas);

            const renderTask = page.render({

                canvasContext: context,

                viewport: viewport,

                transform: [
                    pixelRatio, 0,
                    0, pixelRatio,
                    0, 0
                ]

            });

            renderTask.promise.then(function() {

                document.getElementById("pageNum").value =
                    number;

            }).catch(function(error) {

                console.error(error);

                document.getElementById("status").textContent =
                    "Error displaying this page.";

            });

        }).catch(function(error) {

            console.error(error);

            document.getElementById("status").textContent =
                "Unable to load this page.";

        });

    }

    function previousPage() {

        if (pdfDoc && currentPage > 1) {

            currentPage--;

            renderPage(currentPage);

        }

    }

    function nextPage() {

        if (pdfDoc && currentPage < pdfDoc.numPages) {

            currentPage++;

            renderPage(currentPage);

        }

    }

    function goToPage() {

        if (!pdfDoc) return;

        const number = Number(
            document.getElementById("pageNum").value
        );

        if (
            Number.isInteger(number) &&
            number >= 1 &&
            number <= pdfDoc.numPages
        ) {

            currentPage = number;

            renderPage(currentPage);

        }

    }

    function zoomIn() {

        if (!pdfDoc) return;

        scale = Math.min(scale + 0.3, 3.5);

        renderPage(currentPage);

    }

    function zoomOut() {

        if (!pdfDoc) return;

        scale = Math.max(scale - 0.3, 0.7);

        renderPage(currentPage);

    }

}

</script>

</body>
</html>
